name: ci

# The ONLY workflow entrypoint in this repository (zackees/ci.yml#6 §1/§2,
# D1 "one PR entrypoint"). `precheck` (below) calls ci-precheck.yml through
# `workflow_call` and every other job `needs:` it, directly or transitively.
# ci.toml's `linter` pin and this file's ci-precheck.yml checkout ref MUST
# match (`CT-004`).
#
# Round 3 (ci.yml#6 round 3B) adds: tag-selected platform lanes
# (`platform-build` cross-compiles on Linux; `platform-run` executes on
# each platform's own native runner, no Rust toolchain there), job
# display names carrying each lane's digest (`needs.precheck.outputs.
# lane_digests_json`) for title-edit reuse matching, and `fast`/`dylint`
# skipping outright when the precheck-computed plan already found a
# proven-green job for the identical digest on the identical PR head SHA.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "7 3 * * *" # daily; ci.toml [flow.nightly] schedule = "daily"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA the release graph runs against.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    uses: ./.github/workflows/ci-precheck.yml
    permissions:
      contents: read
      # Read-only Actions API access, passed down into ci-precheck.yml's
      # own `permissions:` (a reusable workflow's effective token
      # permissions are the caller's grant, intersected with the
      # callee's own request) -- needed for `ci_lint plan --reuse`'s
      # title-edit reuse lookup (GET .../actions/runs, GET
      # .../actions/runs/{id}/jobs). Free as of round-4B (zackees/ci.yml
      # @31369f5): `actions: read` no longer needs a ci.toml
      # `[[exceptions]]` entry, top-level or per-job.
      actions: read
    with:
      pr-title: ${{ github.event.pull_request.title || '' }}
      event-name: ${{ github.event_name }}
      dispatch-sha: ${{ github.event.inputs.sha || '' }}

  # Round-4B (ci.yml#6 §6, "pre-prune before writing"). Writer flows only
  # (`plan.cache_mode == "write"`: main push, nightly) -- a PR run skips
  # this job outright (`if:` below), and `fast`/`dylint`/`platform-build`
  # tolerate that skip (`!cancelled() && !failure()`, not a bare
  # `needs.cache-maint.result == 'success'`, so an ordinary PR run is
  # unaffected). `actions: write` is the one non-free grant this repo
  # uses (ci.toml [allow].permissions."actions: write" = ["cache-maint"]).
  cache-maint:
    name: cache-maint
    needs: precheck
    if: needs.precheck.outputs.cache_save == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      lockfile_changed: ${{ steps.lockfile.outputs.changed }}
    steps:
      - name: Checkout (fetch-depth 2 -- lockfile_changed.py needs HEAD^)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Skipped under act (zackees/ci.yml#6 round-4B, act parity):
      # actions/checkout's `repository:` override needs a real token even
      # for a public repo, which act does not auto-populate (see
      # ci/localrun/README.md "GITHUB_TOKEN and cross-repo checkouts").
      # `python3 ci/local.py act`'s host-side step (ci/localrun/
      # ci_lint_checkout.py) already git-clones the SAME ci.toml-pinned
      # SHA into `.ci-lint/` in the bind-mounted repo BEFORE act ever
      # starts, so it is already present here under act; this step would
      # be redundant even if it worked.
      - name: Checkout ci-lint (zackees/ci.yml, pinned -- ci.toml `linter`)
        if: env.ACT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zackees/ci.yml
          ref: 31369f521ed524370396cad3a5717abd6762d4dc
          path: .ci-lint
          persist-credentials: false

      - name: Did Cargo.lock/uv.lock/rust-toolchain.toml change vs the parent commit?
        id: lockfile
        run: python3 ci/lockfile_changed.py

      - name: Pre-prune (forecast the lockfile-change peak; prune if over budget)
        if: steps.lockfile.outputs.changed == 'true'
        env:
          PYTHONPATH: .ci-lint
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci_lint cache preprune --repo . --lockfile-changed --max-deletes 50

      - name: Janitor (nightly only -- CACHE-001/003/005/006/009 + stale entries)
        if: github.event_name == 'schedule'
        env:
          PYTHONPATH: .ci-lint
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci_lint cache janitor --repo . --max-deletes 50

  # Job id MUST be exactly "fast" -- ci_lint gate's required-job-id
  # convention (orchestrator decision on zackees/ci.yml PR #11: precheck,
  # fast, dylint, and only when plan.needs_platform_lanes: platform-build
  # + platform-run, added round 3). Skipped outright when the plan found
  # a proven-green "fast" job for the identical digest on this PR's head
  # SHA (title-edit reuse, round 3A) -- ci_lint gate --reuse verifies
  # that live before ever accepting this "skipped" as a pass.
  fast:
    name: fast [${{ fromJSON(needs.precheck.outputs.lane_digests_json).fast }}]
    needs: [precheck, cache-maint]
    # `!cancelled() && !failure()`, not a bare default/`always()`: runs
    # unless precheck or cache-maint actually FAILED (still skips if
    # either was cancelled), but tolerates cache-maint's normal SKIP on
    # every PR run (round-4B: cache-maint's own `if:` only fires on
    # writer flows) -- the plain default `if:` (implicit `success()`)
    # would otherwise skip `fast` on every PR too, since `success()` is
    # false when any `needs:` entry is skipped, not just failed.
    if: ${{ !cancelled() && !failure() && needs.precheck.outputs.fast_reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # .cargo/config.toml enables incremental for local dev; a CI job
      # must never cache incremental/ (ci.toml [cache] `never`, `RUST-006`)
      # and incremental state from one job never helps a fresh checkout.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skipped under act -- see the `fast` job's identical step for why.
      - name: Checkout ci-lint (zackees/ci.yml, pinned -- ci.toml `linter`)
        if: env.ACT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zackees/ci.yml
          ref: 31369f521ed524370396cad3a5717abd6762d4dc
          path: .ci-lint
          persist-credentials: false

      - name: Setup soldr
        uses: ./.github/actions/soldr
        with:
          ci-tests: "true"
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: fmt
        run: ./ci.sh fmt

      - name: clippy
        run: ./ci.sh clippy

      # ci-lint's GEN-004 scans this job's `run:` lines by their literal
      # shell tokens (a `python3 ci/<x>.py` line is followed one level
      # into that script's own literal `subprocess.run([...])` argv --
      # ci/gates/ruff.py's variable-built `cmd` list, and its pinned
      # RUFF_PIN constant, are each NOT a literal at that call site, so
      # GEN-004 cannot see through `./ci.sh ruff`). These two steps are
      # therefore the literal, GEN-004-visible form; `./ci.sh ruff`
      # (ci/gates/ruff.py, same RUFF_PIN/targets) stays available for
      # local dev (`./ci.sh all`) and must be kept in sync by hand if
      # either changes.
      - name: ruff check (GEN-004; import-sort I rules via pyproject.toml)
        run: uv run --no-project --with ruff==0.15.18 ruff check --config pyproject.toml src tests ci action ci.py lint test install

      - name: ruff format --check (GEN-004)
        run: uv run --no-project --with ruff==0.15.18 ruff format --check --config pyproject.toml src tests ci action ci.py lint test install

      - name: Build + capture compiler-artifact JSON
        run: python3 ci/fast.py build-json --out ${{ runner.temp }}/cargo-messages.jsonl

      - name: ci_lint units (compile-unit discipline, RUST-011/RUST-012)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint units --repo . --artifacts ${{ runner.temp }}/cargo-messages.jsonl

      - name: ci_lint tests size (test-binary budget, RUST-012)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint tests size --repo . --artifacts ${{ runner.temp }}/cargo-messages.jsonl

      # Round-4B suite gating: `[no-test]` (ci.toml [tags].no-test removes
      # EVERY suite, including the required `unit`/`smoke` ones -- that
      # sentinel removal is exactly what makes the run non-mergeable, per
      # `ci_lint gate`) skips these two test steps. Packaging (build,
      # wheel, install, smoke) and lint/Dylint are NOT suite-gated and
      # always run -- an un-mergeable `[no-test]` run still proves the
      # artifact builds.
      - name: Run Rust tests (unit suite, when selected)
        if: contains(fromJSON(needs.precheck.outputs.fast_suites_json), 'unit')
        run: python3 ci/fast.py rust-test

      # Unconditional (unlike the pytest run below): `_native` must be
      # built for `pylint`'s `--extension-pkg-allow-list` regardless of
      # whether the `unit` suite itself is selected.
      - name: Sync Python env (builds `_native` for pylint + packaging)
        run: python3 ci/fast.py python-sync

      # Same GEN-004 note as the ruff steps above: this is the literal,
      # AST-visible form; `./ci.sh pylint` (ci/gates/pylint.py, same
      # PYLINT_PIN/targets/allow-list) stays available for local dev.
      - name: pylint (GEN-004)
        run: uv run --no-project --with pylint==4.0.9 --with pytest python3 -m pylint src ci tests action --extension-pkg-allow-list=template_python_rust_cmd._native

      - name: Run Python tests (unit suite, when selected)
        if: contains(fromJSON(needs.precheck.outputs.fast_suites_json), 'unit')
        run: python3 ci/fast.py python-test

      - name: Integration suite (ci.toml [suites].integration, when selected)
        if: contains(fromJSON(needs.precheck.outputs.fast_suites_json), 'integration')
        run: python3 ci/fast.py integration-test

      - name: Build wheel (Soldr PEP 517 backend via uv build)
        id: wheel-build
        run: python3 ci/fast.py wheel-build --out dist/fast-lane

      - name: ci_lint wheel check (PKG-003/004/005, static)
        env:
          PYTHONPATH: .ci-lint
          WHEEL_PATH: ${{ steps.wheel-build.outputs.wheel-path }}
        run: python3 -m ci_lint wheel check --repo . --wheel "$WHEEL_PATH"

      - name: Clean-venv wheel install
        run: python3 ci/fast.py wheel-install --wheel-dir dist/fast-lane --venv .venv-smoke --python 3.11

      - name: ci_lint wheel installed (PKG-001/003/005, from the artifact)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint wheel installed --repo . --venv .venv-smoke

  dylint:
    name: dylint [${{ fromJSON(needs.precheck.outputs.lane_digests_json).dylint }}]
    needs: [precheck, cache-maint]
    # See `fast`'s identical condition comment above.
    if: ${{ !cancelled() && !failure() && needs.precheck.outputs.dylint_reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup soldr (Dylint mode)
        uses: ./.github/actions/soldr
        with:
          dylint: "true"
          # This workspace's auto-mapped nightly (from its stable 1.95.0
          # channel) has no catalogued Dylint driver asset; nightly-2026-05-28
          # does (zackees/clud's working _dylint.yml pattern). Must equal
          # dylints/platform_boundary/rust-toolchain.toml's channel exactly.
          dylint-toolchain: "nightly-2026-05-28"
          prebuild-deps: "none"
          verify-compile-cache: "warn"
          cache-key-suffix: "dylint"
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: Dylint -- host + every declared cross target
        run: python3 ci/dylint.py --shape multi-target --results-out ${{ runner.temp }}/dylint-results.json

  # Job id MUST be exactly "platform-build" (ci_lint gate's required-job-id
  # convention). One Linux job per non-default-platform lane still needing
  # work (needs.precheck.outputs.platform_lanes_todo_json -- platform_lanes
  # minus any lane already reused from an earlier run of this same PR head
  # SHA, round 3A). Cross-compiles that lane's test binaries, native CLI,
  # and wheel, all on Linux through Soldr; nothing here ever runs on the
  # target's own OS (zackees/ci.yml#6 §2/§3, D4).
  platform-build:
    name: platform-build (${{ matrix.lane.id }}) [${{ fromJSON(needs.precheck.outputs.lane_digests_json)[format('platform:{0}', matrix.lane.id)] }}]
    needs: [precheck, cache-maint]
    # See `fast`'s identical condition comment above.
    if: ${{ !cancelled() && !failure() && needs.precheck.outputs.platform_lanes_todo_json != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A custom axis named "lane" whose values are the FULL per-platform
        # objects (not `include:`, which would flatten each object's keys to
        # top-level `matrix.*` properties instead) -- this is what makes
        # `matrix.lane.id`/`.target`/`.runs_on`/`.suites` (used throughout
        # this job and in its own display name above) valid.
        lane: ${{ fromJSON(needs.precheck.outputs.platform_lanes_todo_json) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skipped under act -- see the `fast` job's identical step for why.
      - name: Checkout ci-lint (zackees/ci.yml, pinned -- ci.toml `linter`)
        if: env.ACT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zackees/ci.yml
          ref: 31369f521ed524370396cad3a5717abd6762d4dc
          path: .ci-lint
          persist-credentials: false

      - name: Setup soldr (cross target ${{ matrix.lane.target }})
        uses: ./.github/actions/soldr
        with:
          ci-tests: "true"
          cross-target: ${{ matrix.lane.target }}
          cache-key-suffix: platform-build
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: Build + capture compiler-artifact JSON (cross target)
        run: python3 ci/platform_build.py build-json --target ${{ matrix.lane.target }} --out ${{ runner.temp }}/cargo-messages.jsonl

      - name: ci_lint units (compile-unit discipline, RUST-011/RUST-012, cross target)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint units --repo . --artifacts ${{ runner.temp }}/cargo-messages.jsonl

      - name: ci_lint tests size (test-binary budget, RUST-012, cross target)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint tests size --repo . --artifacts ${{ runner.temp }}/cargo-messages.jsonl

      - name: Build wheel (Soldr PEP 517 backend, cross target via config setting)
        id: wheel-build
        run: python3 ci/platform_build.py wheel-build --target ${{ matrix.lane.target }} --out dist/platform-${{ matrix.lane.id }}

      - name: ci_lint wheel check (PKG-003/004/005, static, cross target -- fail fast before upload)
        env:
          PYTHONPATH: .ci-lint
          WHEEL_PATH: ${{ steps.wheel-build.outputs.wheel-path }}
        run: python3 -m ci_lint wheel check --repo . --wheel "$WHEEL_PATH"

      - name: Stage test binaries + native CLI + wheel for platform-run
        run: python3 ci/platform_build.py stage --lane-id ${{ matrix.lane.id }} --target ${{ matrix.lane.target }} --artifacts ${{ runner.temp }}/cargo-messages.jsonl --wheel-dir dist/platform-${{ matrix.lane.id }} --out ${{ runner.temp }}/stage

      - name: Upload staged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.lane.id }}
          path: ${{ runner.temp }}/stage
          retention-days: 1
          if-no-files-found: error

  # Job id MUST be exactly "platform-run". Same lane set as platform-build
  # (platform_lanes_todo_json) so every leg here downloads an artifact its
  # own matching platform-build leg just produced. `runs-on` is the
  # lane's OWN runner (native execution, D4) -- no Rust toolchain, no
  # `soldr`/`cargo` step anywhere in this job.
  platform-run:
    name: platform-run (${{ matrix.lane.id }}) [${{ fromJSON(needs.precheck.outputs.lane_digests_json)[format('platform:{0}', matrix.lane.id)] }}]
    needs: [precheck, platform-build]
    # `!cancelled() && !failure() && ...`, not the bare comparison alone:
    # observed empirically on a real run (36506934489, ci.yml#6 round-4B
    # worker report) that a bare `needs.platform-build.result ==
    # 'success'` -- with no explicit status-check function in the
    # expression -- skipped `platform-run` even though `platform-build`
    # had just succeeded, in the SAME run where `fast`/`dylint` were
    # title-edit-reused (skipped). GitHub Actions auto-prepends
    # `success()` to a job `if:` that contains no status-check function
    # of its own, and `success()` is documented to fail when ANY job
    # anywhere earlier in the run's dependency graph is not a `success`
    # -- including a job this one doesn't directly `need:` at all
    # (`cache-maint`, skipped on every PR run by design). Same fix as
    # `fast`/`dylint`/`platform-build`'s identical-shaped conditions.
    if: ${{ !cancelled() && !failure() && needs.platform-build.result == 'success' }}
    runs-on: ${{ matrix.lane.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A custom axis named "lane" whose values are the FULL per-platform
        # objects (not `include:`, which would flatten each object's keys to
        # top-level `matrix.*` properties instead) -- this is what makes
        # `matrix.lane.id`/`.target`/`.runs_on`/`.suites` (used throughout
        # this job and in its own display name above) valid.
        lane: ${{ fromJSON(needs.precheck.outputs.platform_lanes_todo_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skipped under act -- see the `fast` job's identical step for why.
      - name: Checkout ci-lint (zackees/ci.yml, pinned -- ci.toml `linter`)
        if: env.ACT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zackees/ci.yml
          ref: 31369f521ed524370396cad3a5717abd6762d4dc
          path: .ci-lint
          persist-credentials: false

      - name: Download staged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-${{ matrix.lane.id }}
          path: ${{ runner.temp }}/stage

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          save-cache: ${{ needs.precheck.outputs.cache_save }}

      - name: Run every declared test binary directly (unit suite, when selected; no Rust toolchain)
        if: contains(matrix.lane.suites, 'unit')
        run: python3 ci/platform_run.py run-tests --artifact-dir ${{ runner.temp }}/stage --results-out ${{ runner.temp }}/platform-run-results.json

      - name: Clean-venv wheel install (floor Python)
        id: wheel-install
        run: python3 ci/platform_run.py wheel-install --artifact-dir ${{ runner.temp }}/stage --venv .venv-smoke --python 3.11

      - name: ci_lint wheel check (PKG-003/004/005, static, downloaded artifact)
        # Explicit `bash` (allowed by GEN-005; only pwsh/cmd/powershell are
        # banned): the default shell on a windows-* runner is pwsh, where
        # "$WHEEL_PATH" is an undefined PowerShell variable, not the env
        # var below -- it silently expands to "", not a missing-var error
        # (found via run 36498352193's platform-run (windows-x64) leg:
        # `ci_lint wheel check --wheel ""` -> PKG-003 "'' is not a
        # well-formed wheel filename"). platform-build's identical pattern
        # never hit this: that job only ever runs on ubuntu-24.04.
        shell: bash
        env:
          PYTHONPATH: .ci-lint
          WHEEL_PATH: ${{ steps.wheel-install.outputs.wheel-path }}
        run: python3 -m ci_lint wheel check --repo . --wheel "$WHEEL_PATH"

      - name: ci_lint wheel installed (PKG-001/003/005, native runner)
        env:
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint wheel installed --repo . --venv .venv-smoke

      - name: Integration suite (ci.toml [suites].integration, when selected)
        if: contains(matrix.lane.suites, 'integration')
        run: python3 ci/platform_run.py integration-test --venv .venv-smoke

  ci-ok:
    name: CI OK
    if: always()
    needs: [precheck, fast, dylint, platform-build, platform-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read-only Actions API access for `ci_lint gate --reuse`'s live
      # re-verification of any job this run accepted as "skipped because
      # reused" (GET /repos/.../actions/jobs/{id}) -- round 3A "Reuse
      # verification". See ci.toml [[exceptions]] (SEC-002).
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skipped under act -- see the `fast` job's identical step for why.
      - name: Checkout ci-lint (zackees/ci.yml, pinned -- ci.toml `linter`)
        if: env.ACT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zackees/ci.yml
          ref: 31369f521ed524370396cad3a5717abd6762d4dc
          path: .ci-lint
          persist-credentials: false

      - name: Gate
        env:
          PYTHONPATH: .ci-lint
          CI_OK_PLAN_JSON: ${{ needs.precheck.outputs.plan }}
          CI_OK_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_OK_REUSE_JSON: ${{ needs.precheck.outputs.reuse_json }}
          CI_OK_EVENT_JSON: ${{ toJSON(github.event) }}
          # See the precheck job's own comment: read-only, required for
          # ci_lint gate --reuse's live verification.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/ci_ok.py
