[package]
name = "template-ballast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "sim/clud-scale ONLY (ci.yml#6 round 4C step 4, never merged to main): a representative heavy dependency closure standing in for a clud-sized workspace, so cache footprint / cold-vs-warm timing / PR-delta size can be measured against a real 9GB budget instead of extrapolated from this template's much smaller real graph."
publish = false

[lib]
name = "template_ballast"
doctest = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
